version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      # Micro-allocation suggestions in table-driven tests add indirection
      # without improving the production contract.
      - linters:
          - prealloc
        path: '(.+)_test\.go'
      # Status-conflict retries intentionally use controller-runtime's
      # rate-limited Requeue contract; RequeueAfter changes that behavior.
      - linters:
          - staticcheck
        path: internal/controller/.*\.go
        text: 'Requeue is deprecated'
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        path: internal/*
      # Test files in pkg/ contain connect-go handler signatures and
      # table-driven test rows that are inherently long; breaking them
      # hurts readability more than the cap helps.
      - linters:
          - lll
        path: pkg/.*_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
