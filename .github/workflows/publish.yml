name: publish
on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z; empty = edge :main test"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@414aeb877c157ce559592551b222bbd90db61ce7 # v1.9.9 # zizmor: ignore[unpinned-uses]
    with:
      release-tag: ${{ inputs.release_tag }}
      helm-chart-path: charts/fleet-management-operator

  kustomize-installer:
    if: inputs.release_tag != ''
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - name: Install dev tools
        run: just setup
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          IMG="${IMAGE_REPO}:${RELEASE_TAG#v}" just build-installer
          mv dist/install.yaml "dist/install-${RELEASE_TAG}.yaml"
          gh release upload "${RELEASE_TAG}" "dist/install-${RELEASE_TAG}.yaml" --clobber
