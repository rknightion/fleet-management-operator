name: publish
on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: "vX.Y.Z; empty = edge :main test"
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: rknightion/.github/.github/workflows/container-publish.yml@f31690684f4292d1fe8e528618f7c8306fe27d9a # v1.3.1 # zizmor: ignore[unpinned-uses]
    with:
      release-tag: ${{ inputs.release_tag }}
      helm-chart-path: charts/fleet-management-operator

  kustomize-installer:
    if: inputs.release_tag != ''
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          make build-installer IMG="${IMAGE_REPO}:${RELEASE_TAG#v}"
          mv dist/install.yaml "dist/install-${RELEASE_TAG}.yaml"
          gh release upload "${RELEASE_TAG}" "dist/install-${RELEASE_TAG}.yaml" --clobber
