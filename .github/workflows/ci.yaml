name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install dev tools
        run: just setup

      - name: Run lint
        run: just lint

  # Everything below gates on lint. Lint is the cheapest job (~35s) and the one
  # most likely to fail on a dependency bump, so running the expensive jobs
  # alongside it spends five runners to learn what one already knows.
  #
  # On 2026-08-10, twenty stuck Renovate PRs each failed lint on an untidy
  # go.sum while simultaneously queueing ~11 jobs apiece — a ~114-run Actions
  # queue, almost all of it computing results that were already determined.
  # Gated, that is one short job per PR.
  #
  # The trade is real and accepted: a healthy PR waits lint's ~35s before the
  # rest start, and a red lint no longer reports the other failures in the same
  # run. Cross-workflow jobs (e2e, CodeQL) cannot be gated this way — `needs`
  # does not span workflows.
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Download dependencies
        run: go mod download

      - name: Install dev tools
        run: just setup

      - name: Run tests
        run: just test

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: ./cover.out
          fail_ci_if_error: false

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: always()
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cover.out
          force-coverage-parser: go

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install dev tools
        run: just setup

      - name: Build
        run: just build

      - name: Verify generated code is committed
        run: just gen-check

  verify-installer:
    name: Verify Installer Bundle
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install dev tools
        run: just setup

      - name: Verify installer bundle is committed
        run: just installer-check

  verify-docs:
    name: Verify Documentation
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install dev tools
        run: just setup

      - name: Verify auto-generated documentation
        run: just docs-check

  verify-helm:
    name: Verify Helm Chart
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.2.4

      - name: Install dev tools
        run: just setup

      - name: Lint and template Helm chart
        run: just helm-lint

      - name: Verify chart README is regenerated from values.yaml
        run: just chart-docs-check

  # This chart published to GHCR with no schema validation against the real
  # Kubernetes API schemas at all — `verify-helm` above only runs helm's own
  # lint plus this repo's own render-gate assertions, never a kubeconform check.
  # Chart.yaml declares kubeVersion >=1.23.0-0, so this validates against that
  # floor. Reproduces verify-helm's two renders (default, and
  # networkPolicy.enabled=true) with the same required credential --set values
  # every render needs (templates/secret.yaml `required`s them).
  #
  # CAVEAT (reported, not resolved here): webhook.certManager.enabled defaults
  # to true, so the DEFAULT render includes a cert-manager.io/v1 Certificate —
  # a CRD-defined kind kubeconform has no built-in schema for. With
  # schema-locations left at "default" this permutation is expected to fail
  # kubeconform until a CRD schema catalogue (e.g. the datreeio/CRDs-catalog
  # cert-manager.io entry) is added to schema-locations. Left as default here
  # per instruction not to guess a schema-locations value or set
  # ignore-missing-schemas — flagging for a follow-up decision instead.
  helm-schema-validate:
    name: helm schema validate (kubeconform)
    needs: lint
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@0e21ae9045ca3e5ae522b711030b70c53b8d94be # v1.15.0
    with:
      chart-path: charts/fleet-management-operator
      # The default render includes cert-manager.io/v1 Certificate, a CRD kind
      # kubeconform has no built-in schema for. The fix is to give it the schema,
      # NOT -ignore-missing-schemas: that flag would skip the Certificate and every
      # other unschema'd kind silently, so the check could pass while validating
      # nothing. Same catalogue codex-lb already uses for Gateway API.
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      kubernetes-versions: "1.23.0"
      lint-args: >-
        --set fleetManagement.baseUrl=https://test
        --set fleetManagement.username=test
        --set fleetManagement.password=test
      permutations: |-
        --set fleetManagement.baseUrl=https://test --set fleetManagement.username=test --set fleetManagement.password=test
        --set fleetManagement.baseUrl=https://test --set fleetManagement.username=test --set fleetManagement.password=test --set networkPolicy.enabled=true

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, verify-installer, verify-docs, verify-helm, helm-schema-validate]
    steps:
      # 'skipped' counts as failure. Now that the other jobs gate on lint, a
      # failing lint SKIPS them rather than failing them, and skipped is
      # neither failure nor cancelled — without this a red lint could report
      # ci-success green and let automerge merge it. lint's own 'failure'
      # happens to catch today's case because lint is in this needs list, but
      # relying on that would break the moment a job gains an `if:`.
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
