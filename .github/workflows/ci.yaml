name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result." && exit 1)

      - name: Run lint
        run: make lint

  # Everything below gates on lint. Lint is the cheapest job (~35s) and the one
  # most likely to fail on a dependency bump, so running the expensive jobs
  # alongside it spends five runners to learn what one already knows.
  #
  # On 2026-08-10, twenty stuck Renovate PRs each failed lint on an untidy
  # go.sum while simultaneously queueing ~11 jobs apiece — a ~114-run Actions
  # queue, almost all of it computing results that were already determined.
  # Gated, that is one short job per PR.
  #
  # The trade is real and accepted: a healthy PR waits lint's ~35s before the
  # rest start, and a red lint no longer reports the other failures in the same
  # run. Cross-workflow jobs (e2e, CodeQL) cannot be gated this way — `needs`
  # does not span workflows.
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: ./cover.out
          fail_ci_if_error: false

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: always()
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: cover.out
          force-coverage-parser: go

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Generate manifests
        run: make manifests

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Uncommitted changes detected. Run 'make manifests generate' and commit." && exit 1)

  verify-installer:
    name: Verify Installer Bundle
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate install.yaml
        run: make build-installer

      - name: Verify install.yaml is committed
        run: |
          git diff --exit-code -- dist/install.yaml || (echo "dist/install.yaml is out of date. Run 'make build-installer' and commit the result." && exit 1)

  verify-docs:
    name: Verify Documentation
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify auto-generated documentation
        run: make docs-check

  verify-helm:
    name: Verify Helm Chart
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Lint Helm chart
        run: |
          helm lint charts/fleet-management-operator \
            --set fleetManagement.baseUrl=https://test \
            --set fleetManagement.username=test \
            --set fleetManagement.password=test

      - name: Template Helm chart
        run: |
          helm template test charts/fleet-management-operator \
            --set fleetManagement.baseUrl=https://test \
            --set fleetManagement.username=test \
            --set fleetManagement.password=test \
            > /dev/null

      - name: Verify NetworkPolicy render gate
        run: |
          helm template test charts/fleet-management-operator \
            --set fleetManagement.baseUrl=https://test \
            --set fleetManagement.username=test \
            --set fleetManagement.password=test \
            > /tmp/chart-default.yaml
          if grep -q "kind: NetworkPolicy" /tmp/chart-default.yaml; then
            echo "NetworkPolicy should be disabled by default"
            exit 1
          fi
          helm template test charts/fleet-management-operator \
            --set fleetManagement.baseUrl=https://test \
            --set fleetManagement.username=test \
            --set fleetManagement.password=test \
            --set networkPolicy.enabled=true \
            > /tmp/chart-networkpolicy.yaml
          grep -q "kind: NetworkPolicy" /tmp/chart-networkpolicy.yaml

      - name: Verify chart README is regenerated from values.yaml
        run: make chart-docs-check

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, verify-installer, verify-docs, verify-helm]
    steps:
      # 'skipped' counts as failure. Now that the other jobs gate on lint, a
      # failing lint SKIPS them rather than failing them, and skipped is
      # neither failure nor cancelled — without this a red lint could report
      # ci-success green and let automerge merge it. lint's own 'failure'
      # happens to catch today's case because lint is in this needs list, but
      # relying on that would break the moment a job gains an `if:`.
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
