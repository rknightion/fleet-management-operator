name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # PAT (not GITHUB_TOKEN): bot-authored release PRs need a non-default-token author for CI to run without manual approval
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # Edge build on every non-release push to main: publishes :main multi-arch image
  # + a main-snapshot Helm chart (replaces the removed docker.yaml :dev push).
  # release_created gates this vs publish, so they never both run on one push.
  edge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""
