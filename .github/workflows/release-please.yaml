name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@bc58399e49a8d8131a379f530fffe8c9659667f9
        with:
          permission-set: release-please-fleet-management-operator
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.bao.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # Edge build on every non-release push to main: publishes :main multi-arch image
  # + a main-snapshot Helm chart (replaces the removed docker.yaml :dev push).
  # release_created gates this vs publish, so they never both run on one push.
  edge:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ""