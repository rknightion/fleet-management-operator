name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Install dev tools
        run: just setup

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: fm-crd-e2e
          wait: 5m

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E tests
        run: just test-e2e
        env:
          KIND_CLUSTER: fm-crd-e2e
        timeout-minutes: 15

      - name: Collect controller logs on failure
        if: failure()
        run: |
          mkdir -p logs
          kubectl logs -n fm-crd-system -l control-plane=controller-manager --tail=-1 > logs/controller.log 2>&1 || true
          kubectl logs -n fm-crd-system -l app=mock-fleet-api --tail=-1 > logs/mock-api.log 2>&1 || true
          kubectl describe pods -n fm-crd-system > logs/pods.txt 2>&1 || true
          kubectl get events -n fm-crd-system --sort-by=.lastTimestamp > logs/events.txt 2>&1 || true
          kubectl get pipelines -n fm-crd-system -o yaml > logs/pipelines.yaml 2>&1 || true

      - name: Export Kind logs on failure
        if: failure()
        run: |
          kind export logs logs/kind-export --name fm-crd-e2e || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-logs
          path: logs/
          retention-days: 7
