---
# Repo-local Codacy configuration.
#
# Tool selection and patterns are governed centrally by the organization
# "rknightion-standard" coding standard (Codacy Cloud), NOT by this file — do
# not add a `tools:`/`patterns:` block here. This file only narrows WHAT Codacy
# analyzes: Codacy Cloud reads `exclude_paths` from the default branch to skip
# generated, vendored, and test files that would otherwise add noise (to quality,
# duplication, and coverage alike).
#
# Glob syntax is Java-style (`**` spans directories). See
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
exclude_paths:
  # --- shared convention (kept in sync across rknightion repos) ---
  - "docs/**"          # user + generated docs (docs/events.md, runbooks, API reference)
  - "test/**"          # e2e + integration test trees
  - "**/*_test.go"     # Go test files — high-churn, trip complexity/security rules
  - "vendor/**"        # vendored deps (none today under Go modules; future-proofing)
  - "**/*.gen.go"      # code-generated Go (future-proofing)
  - "**/generated/**"  # any generated/ tree (future-proofing)

  # --- repo-specific generated artifacts ---
  - "**/zz_generated*.go"        # controller-gen DeepCopy (api/v1alpha1/zz_generated.deepcopy.go)
  - "config/crd/bases/**"        # controller-gen CRD manifests (just manifests)
  - "charts/**/crds/**"          # CRD copies synced into the Helm chart
  - "charts/**/README.md"        # generated by helm-docs from README.md.gotmpl (fail-on-diff in CI)
  - "dist/**"                    # kustomize build output (dist/install.yaml)
