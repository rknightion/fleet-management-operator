{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fleet-management-operator.fullname" . }}-manager-role
  labels:
    {{- include "fleet-management-operator.labels" . | nindent 4 }}
rules:
{{- if .Values.controllers.pipeline.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelines/finalizers
  verbs:
  - update
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelines/status
  verbs:
  - get
  - patch
  - update
{{- end }}
{{- if .Values.controllers.collector.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors/finalizers
  verbs:
  - update
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors/status
  verbs:
  - get
  - patch
  - update
# The Collector reconciler reads RemoteAttributePolicy and
# ExternalAttributeSync resources to compute the merged desired attribute
# set. Granted whenever the collector controller is enabled, regardless of
# which other controllers are.
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - remoteattributepolicies
  - externalattributesyncs
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- if .Values.controllers.remoteAttributePolicy.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - remoteattributepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - remoteattributepolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- if .Values.controllers.externalAttributeSync.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - externalattributesyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - externalattributesyncs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors
  verbs:
  - get
  - list
  - watch
{{- if .Values.controllers.externalAttributeSync.clusterWideSecretAccess }}
# Cluster-wide Secret read is the auth material ExternalAttributeSync sources
# reference. Set controllers.externalAttributeSync.clusterWideSecretAccess=false
# to drop this rule and instead provision namespaced Roles for the namespaces
# that hold EAS Secrets (least-privilege; see docs/security.md). Pair with
# --external-source-secret-label-selector to also scope the informer cache.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- end }}
{{- if .Values.controllers.collectorDiscovery.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectordiscoveries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectordiscoveries/status
  verbs:
  - get
  - patch
  - update
# Discovery creates and deletes Collector CRs. Read verbs are already
# granted by the collector controller (which discovery requires), but we
# add them here too so the chart's clusterrole is self-contained for
# any future split.
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - collectors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
{{- if .Values.controllers.pipelineDiscovery.enabled }}
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelinediscoveries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelinediscoveries/status
  verbs:
  - get
  - patch
  - update
# PipelineDiscovery creates and deletes Pipeline CRs. Read verbs are already
# granted by the pipeline controller block above, but adding write verbs here
# so the clusterrole is self-contained when pipelineDiscovery is enabled
# independently of the pipeline controller.
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - pipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
# TenantPolicy is consulted by the validating webhooks at admission time
# and reconciled to maintain status (Ready / Valid conditions, observed
# generation, bound subject count). The manager needs read access on the
# CR itself plus update on /status; standard K8s RBAC on the CRD governs
# who can create/edit policies (cluster admins by default). The status
# reconciler runs unconditionally, so this RBAC is always granted.
# Namespace read access is needed to evaluate spec.namespaceSelector.
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - tenantpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - fleetmanagement.grafana.com
  resources:
  - tenantpolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# The PipelineDiscovery / CollectorDiscovery validating webhooks issue a
# SubjectAccessReview to confirm the requester may create Pipeline / Collector
# CRs in a foreign spec.targetNamespace, closing the cross-namespace
# confused-deputy escalation (gated by --enforce-cross-namespace-discovery-authz).
# Granted unconditionally so the check works whenever the flag is enabled and
# rbac.create is true.
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
{{- end }}
